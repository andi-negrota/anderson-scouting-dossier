[project]
name = "laliga-analytics"
version = "0.1.0"
description = "Informe de scouting de Elliot Anderson (Nottingham Forest -> Manchester City) con datos de FPL, ESPN y FotMob"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "parse-apis",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "parse-sdk",
]

[tool.uv.sources]
parse-apis = { path = "parse_apis", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: levanta la app entera y llama a las APIs reales",
]

